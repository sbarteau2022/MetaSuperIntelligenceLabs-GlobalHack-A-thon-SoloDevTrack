# Pre-Registration: FW-A8 — Serialization (Custom mmap vs FlatBuffers)
#
# Hash: sha256(this_file) → filed at PreRegistrations/FW-A8.hash
# C09 Ablation Framework — Framework Selection Study

ablation_id: "FW-A8"
title: "Serialization/IPC: Custom mmap (Q32.31 fixed-offset) vs FlatBuffers (Rust)"
hypothesis: |
  Custom mmap binary achieves ≤50ns decode latency with zero-copy vs FlatBuffers
  at ≤1.2x memory overhead, with schema evolution support.

# ── Hardware ──────────────────────────────────────────────────────────────
hardware:
  primary:
    name: "MacBook Pro M3 Max"
    cpu: "Apple M3 Max (16-core)"
    memory_gb: 36
    os: "macOS 15.0 (Sequoia)"
    rustc: "1.82.0"
    clang: "17.0.0"
  replica:
    name: "Mac Studio M2 Ultra"
    cpu: "Apple M2 Ultra (24-core)"
    memory_gb: 96
    os: "macOS 15.0 (Sequoia)"
    rustc: "1.82.0"
    clang: "17.0.0"

# ── Workload ──────────────────────────────────────────────────────────────
workload:
  name: "serialization_bench"
  description: |
    Serialize/deserialize hyperbolic KV entries (H³×T² coordinates + KV slices)
    with Q32.31 fixed-point, atomic refcount, schema versioning.
  entries: 1_000_000
  entry_size_bytes: 2048  # coords (32B) + KV slice (2KB) + overhead
  operations:
    - name: "encode"
      count: 1_000_000
    - name: "decode"
      count: 1_000_000
    - name: "mmap_read"
      count: 10_000_000  # zero-copy reads
    - name: "schema_migrate_v1_to_v2"
      count: 1000
  iterations: 100
  warmup: 10
  seed: 42

# ── Baseline (Custom mmap) ────────────────────────────────────────────────
baseline:
  language: "C++ (writer) + Rust (reader)"
  format:
    type: "Custom binary mmap"
    layout: "Fixed-offset Q32.31 + atomic refcount + version header"
    schema: "Versioned (v1, v2...) with migration functions"
    zero_copy: true
  writer:
    language: "C++"
    ipc: "mmap + atomic refcount"
  reader:
    language: "Rust"
    ipc: "memmap2 + pointer cast"
  schema_evolution:
    mechanism: "Explicit migration functions (v1→v2, v2→v3...)"
    verification: "Round-trip test per version"

# ── Treatment (FlatBuffers) ───────────────────────────────────────────────
treatment:
  language: "Rust (both writer + reader)"
  format:
    type: "FlatBuffers"
    layout: "FlatBuffers schema + builder"
    schema: "FlatBuffers schema (fbs) with optional fields"
    zero_copy: true  # FlatBuffers supports zero-copy reads
  writer:
    language: "Rust (flatbuffers crate)"
  reader:
    language: "Rust (flatbuffers crate)"
  schema_evolution:
    mechanism: "FlatBuffers optional fields + deprecated fields"
    verification: "FlatBuffers backward compatibility"

# ── Judge (Pass/Fail Predicate) ───────────────────────────────────────────
judge:
  primary:
    - metric: "decode_latency_ns_ratio"
      threshold: "<= 1.5"
      description: "FlatBuffers decode / Custom mmap decode ≤ 1.5x"
    - metric: "memory_overhead_ratio"
      threshold: "<= 1.2"
      description: "FlatBuffers memory / Custom mmap memory ≤ 1.2x"
  secondary:
    - metric: "encode_latency_ns_ratio"
      threshold: "<= 2.0"
      description: "FlatBuffers encode / Custom mmap encode ≤ 2.0x"
    - metric: "schema_migration_time_ms"
      threshold: "<= 10"
      description: "Schema migration (1M entries) ≤ 10ms"
    - metric: "zero_copy_fidelity"
      threshold: "PASS"
      description: "Zero-copy read verified (no memcpy in hot path)"
    - metric: "cross_lang_compatibility"
      threshold: "PASS"
      description: "C++ writer → Rust reader works (both formats)"

# ── Effect Size Plan ──────────────────────────────────────────────────────
effect_size_plan:
  decode_latency:
    type: "ratio"
    method: "log_normal"
    meaningful_threshold: 1.3
  memory_overhead:
    type: "ratio"
    method: "log_normal"
    meaningful_threshold: 1.15
  encode_latency:
    type: "ratio"
    method: "log_normal"
    meaningful_threshold: 1.5

# ── Statistical Design ────────────────────────────────────────────────────
statistical_design:
  alpha: 0.05
  power: 0.80
  effect_size_assumed: 0.5
  alpha_spending:
    method: "Lan-DeMets"
    rho: 2
  interim_analyses: 4
  futility_threshold: 0.2
  sample_size_per_group: 30

# ── Null Handling ─────────────────────────────────────────────────────────
null_handling:
  if_treatment_wins_or_ties:
    interpretation: "FlatBuffers achieves parity; custom mmap not necessary"
    action: "FW-A8 → OPTIONAL for custom mmap; FlatBuffers viable"
    design_decision: "Consolidate to FlatBuffers; eliminate custom mmap complexity"
  if_inconclusive:
    interpretation: "Tradeoffs unclear; custom mmap simpler for fixed schema"
    action: "Record INFERRED; test Cap'n Proto (FW-A9) as alternative"
    design_decision: "Defer framework lock"
  if_baseline_wins_clear:
    interpretation: "Custom mmap + fixed-offset Q32.31 necessary for sub-50ns decode"
    action: "Record VERIFIED necessity; Custom mmap REQUIRED"
    design_decision: "Lock custom mmap for serialization"

