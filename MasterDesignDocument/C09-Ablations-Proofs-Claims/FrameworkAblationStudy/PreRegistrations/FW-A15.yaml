# Pre-Registration: FW-A15 — Full Stack Integration (Multi-lang vs Zig-only)
#
# Hash: sha256(this_file) → filed at PreRegistrations/FW-A15.hash
# C09 Ablation Framework — Framework Selection Study

ablation_id: "FW-A15"
title: "Full Stack: Multi-lang (Rust+C+++TS+Go) vs Zig-only (WASM frontend, WASM workers, kernels, harness)"
hypothesis: |
  Multi-lang stack Pareto-dominates Zig-only on end-to-end metrics,
  as Zig comptime + async + Metal + WASM ecosystem is immature for full stack.

# ── Hardware ──────────────────────────────────────────────────────────────
hardware:
  primary:
    name: "MacBook Pro M3 Max"
    cpu: "Apple M3 Max (16-core)"
    gpu: "Apple M3 Max (40-core GPU)"
    memory_gb: 36
    os: "macOS 15.0 (Sequoia)"
    rustc: "1.82.0"
    clang: "17.0.0"
    node: "20.17.0"
    go: "1.23.0"
    zig: "0.13.0"
  cloud:
    name: "Cloudflare Workers (Production)"
  replica:
    name: "Mac Studio M2 Ultra"

# ── Workload ──────────────────────────────────────────────────────────────
workload:
  name: "full_stack_e2e_bench"
  description: "Same as FW-A14 workload"
  scenario: "Code generation task (builder lane)"
  iterations: 50
  warmup: 5
  seed: 42

# ── Baseline (Multi-lang) ─────────────────────────────────────────────────
baseline:
  name: "Rust + C++ + TypeScript + Go"
  components:
    kernels: "C++ (FW-A1 winner)"
    inference: "Rust (FW-A4 winner)"
    harness: "Rust (FW-A6 winner)"
    serialization: "Custom mmap (FW-A8 winner)"
    frontend: "TypeScript (FW-A10 winner)"
    workers: "Go WASM (FW-A12 winner)"
  build_time_target_seconds: 300
  total_deploy_mb: 80

# ── Treatment (Zig-only) ──────────────────────────────────────────────────
treatment:
  name: "Zig-only (WASM frontend + WASM workers + kernels + harness)"
  components:
    kernels: "Zig comptime SIMD (FW-A2 treatment)"
    inference: "Zig async + comptime scheduler (FW-A5 treatment)"
    harness: "Zig comptime interfaces (FW-A6 treatment)"
    serialization: "Custom mmap via Zig (port of FW-A8 baseline)"
    frontend: "Zig WASM + custom editor (experimental)"
    workers: "Zig WASM + workers-zig (experimental)"
  boundaries:
    - "All Zig → Zig (no FFI)"
    - "Zig → WASM: native Zig WASM target"
    - "Zig Metal: via C++ shim or metal-cpp"
  build:
    system: "Zig build.zig (single build graph)"
    time_target_seconds: 180
  binary_sizes:
    backend_zig_mb: 30
    kernels_zig_mb: 8
    frontend_wasm_gz_kb: 300
    workers_wasm_kb: 200
    total_deploy_mb: 50

# ── Judge (Pass/Fail Predicate) ───────────────────────────────────────────
judge:
  primary:
    - metric: "e2e_latency_ms_ratio"
      threshold: "<= 1.3"
      description: "Zig-only e2e latency / Multi-lang e2e latency ≤ 1.3x"
    - metric: "total_binary_ratio"
      threshold: "<= 1.2"
      description: "Zig-only total deploy / Multi-lang total deploy ≤ 1.2x"
    - metric: "build_time_ratio"
      threshold: "<= 1.5"
      description: "Zig-only build time / Multi-lang build time ≤ 1.5x"
  secondary:
    - metric: "frontend_parity"
      threshold: ">= 0.7"
      description: "Zig WASM frontend feature parity ≥ 70% (editor, LSP, a11y)"
    - metric: "workers_parity"
      threshold: ">= 0.6"
      description: "Zig WASM workers feature parity ≥ 60% (DO, KV, AI)"
    - metric: "metal_interop_functional"
      threshold: "PASS"
      description: "Zig → Metal kernels functional (via shim)"
    - metric: "comptime_compile_time"
      threshold: "<= 300"
      description: "Zig comptime compilation ≤ 300s"

# ── Effect Size Plan ──────────────────────────────────────────────────────
effect_size_plan:
  e2e_latency:
    type: "ratio"
    method: "log_normal"
    meaningful_threshold: 1.2
  binary_size:
    type: "ratio"
    method: "log_normal"
    meaningful_threshold: 1.15
  build_time:
    type: "ratio"
    method: "log_normal"
    meaningful_threshold: 1.3
  frontend_parity:
    type: "ratio"
    method: "log_normal"
    meaningful_threshold: 1.3

# ── Statistical Design ────────────────────────────────────────────────────
statistical_design:
  alpha: 0.05
  power: 0.80
  effect_size_assumed: 0.6
  alpha_spending:
    method: "Lan-DeMets"
    rho: 2
  interim_analyses: 4
  futility_threshold: 0.2
  sample_size_per_group: 30

# ── Null Handling ─────────────────────────────────────────────────────────
null_handling:
  if_treatment_wins_or_ties:
    interpretation: "Zig-only achieves parity; multi-lang not necessary"
    action: "FW-A15 → Multi-lang OPTIONAL; Zig-only viable"
    design_decision: "Consolidate to Zig-only; single language stack"
    caveat: "Requires Zig 0.14+ with mature WASM + Metal + async"
  if_inconclusive:
    interpretation: "Zig ecosystem gaps (editor, Workers, Metal) block full stack"
    action: "Record INFERRED; multi-lang REQUIRED for now"
    design_decision: "Lock multi-lang; Zig for kernels/harness if FW-A2/A6 pass"
  if_baseline_wins_clear:
    interpretation: "Multi-lang Pareto-optimal; Zig comptime not yet ready for full stack"
    action: "Record VERIFIED necessity; Multi-lang REQUIRED"
    design_decision: "Lock multi-lang stack"

