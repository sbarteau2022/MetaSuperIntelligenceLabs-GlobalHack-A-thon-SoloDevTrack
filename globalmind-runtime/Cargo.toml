[package]
name = "globalmind-runtime"
version = "0.1.0"
edition = "2024"
description = "Typed GlobalMind distillation, trajectory, and SurrealDB admission runtime"
license = "UNLICENSED"

[dependencies]
serde_json = "1"
sha2 = "0.10"
safetensors = "0.5"
# Only for the `source` stage, which decodes a token tape with the model's
# own tokenizer. Off by default; the runtime links no tokenizer otherwise.
core_lm = { path = "../core_lm", optional = true }

[features]
live-forward-model = []
source-stage = ["dep:core_lm"]

[dev-dependencies]
rgah = { path = "../research-grade-harness" }
core_lm = { path = "../core_lm" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "globalmind-contract"
path = "src/bin/globalmind_contract.rs"

[[bin]]
name = "globalmind-distill"
path = "src/bin/globalmind_distill.rs"

[[bin]]
name = "globalmind-hold"
path = "src/bin/globalmind_hold.rs"

[[bin]]
name = "globalmind-tppe-qualify"
path = "src/bin/globalmind_tppe_qualify.rs"

[[bin]]
name = "globalmind-stage"
path = "src/bin/globalmind_stage.rs"

[[bin]]
name = "globalmind-mcp"
path = "src/bin/globalmind_mcp.rs"
