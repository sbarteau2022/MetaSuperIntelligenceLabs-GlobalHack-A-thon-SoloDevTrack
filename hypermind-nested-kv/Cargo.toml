[package]
name = "hypermind-nested-kv"
version = "0.1.0"
edition = "2024"
description = "HyperMind + Nested KV — hyperbolic memory substrate as a plugin MCP server. Map-owned atom storage; no RAG dependency."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = "0.10"
rand = "0.8"

[[bin]]
name = "hypermind-mcp"
path = "src/main.rs"
