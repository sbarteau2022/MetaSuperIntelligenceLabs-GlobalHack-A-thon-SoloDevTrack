[package]
name = "rgah"
version = "0.1.0"
edition = "2024"
description = "Research-grade agentic harness: active inference, free-energy, RSI, Landauer cost."
license = "Apache-2.0"
authors = ["MetaSuperIntelligenceLabs"]

[features]
default = []
live-n3 = []
live-map-plugin = []
synthetic-scaffold = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
# NOTE (last pass): serde_json REMOVED. No JSON anywhere in this crate —
# receipts, plans, packets, session events are native Rust structs.
# Serialization boundary (if ever needed) is bincode, never JSON.
sha2 = "0.10"
globalmind-runtime = { path = "../globalmind-runtime" }
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
cc = "1.0"

[[bin]]
name = "rgah"
path = "src/main.rs"

[[bench]]
name = "smoke"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
