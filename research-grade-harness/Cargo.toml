[package]
name = "rgah"
version = "0.1.0"
edition = "2024"
description = "Research-grade agentic harness: active inference, free-energy, RSI, Landauer cost."
license = "Apache-2.0"
authors = ["MetaSuperIntelligenceLabs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "rgah"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
