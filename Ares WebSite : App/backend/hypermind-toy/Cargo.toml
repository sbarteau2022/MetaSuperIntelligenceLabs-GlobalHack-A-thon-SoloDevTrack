[package]
name = "hypermind-toy"
version = "0.1.0"
edition = "2021"
description = "Solo toy mirroring the backend governed RAG+memory path (mission/receipt/engine/hyperbolic recall), library-only. No server, no stores, no ports."

[lib]
name = "hypermind_toy"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ares-backend = { path = ".." }
