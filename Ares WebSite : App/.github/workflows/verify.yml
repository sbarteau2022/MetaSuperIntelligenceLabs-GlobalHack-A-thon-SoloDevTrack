name: verify
on: [push, pull_request]
jobs:
  gate:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Ares WebSite : App
    steps:
      - uses: actions/checkout@v4
      - name: Run commandments gate
        run: bash scripts/verify/gate.sh
      - name: Frontend typecheck
        run: npm ci && npm run typecheck
